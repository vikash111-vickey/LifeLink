<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuneFlow</title>
    <!-- Use Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #22c55e; /* Green */
            --bg: #000000;      /* Black */
            --card-bg: #111111; /* Dark Gray */
            --text-white: #ffffff;
            --text-gray: #888888;
            --footer-bg: #1f1f1f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- Navigation Bar --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 6%;
            background: transparent;
        }

        .logo {
            color: var(--primary);
            font-size: 2.2rem;
            font-weight: 800;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        nav {
            display: flex;
            gap: 2.5rem;
        }

        nav a {
            color: var(--text-white);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            position: relative;
            transition: color 0.3s ease;
        }

        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: var(--primary);
            transition: width 0.3s ease;
        }

        nav a:hover {
            color: var(--primary);
        }

        nav a:hover::after {
            width: 100%;
        }

        /* --- Hero Section --- */
        main {
            flex: 1;
        }

        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 80px 20px;
            min-height: 60vh;
        }

        .hero h1 {
            font-size: 5rem;
            font-weight: 800;
            margin-bottom: 1.2rem;
            letter-spacing: -2px;
            line-height: 1.1;
        }

        .hero p {
            font-size: 1.25rem;
            color: #e5e5e5;
            margin-bottom: 2.5rem;
            max-width: 600px;
            font-weight: 400;
        }

        .cta-btn {
            background-color: var(--primary);
            color: var(--text-white);
            border: none;
            padding: 16px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .cta-btn:hover {
            background-color: #1ea850;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.5);
        }

        .cta-btn:active {
            transform: translateY(0);
        }

        /* --- Features Section --- */
        .features {
            padding: 80px 6%;
            padding-bottom: 120px;
        }

        .features h2 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .cards-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            width: 340px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }

        .image-wrapper {
            width: 100%;
            height: 240px;
            overflow: hidden;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .image-wrapper img {
            transform: scale(1.05);
        }

        .card-content {
            padding: 24px;
        }

        .card-content h3 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: var(--text-white);
            font-weight: 600;
        }

        .card-content p {
            color: var(--text-gray);
            font-size: 1.05rem;
            font-weight: 400;
        }

        /* --- Footer --- */
        footer {
            background-color: var(--footer-bg);
            padding: 40px 20px;
            text-align: center;
            margin-top: auto;
        }

        footer p {
            color: #f1f1f1;
            font-size: 1rem;
            font-weight: 400;
        }

        /* --- Responsive Design --- */
        @media (max-width: 900px) {
            .hero h1 {
                font-size: 3.5rem;
            }
            .cards-container {
                gap: 20px;
            }
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1.5rem;
                padding: 20px 5%;
            }
            .hero {
                padding: 60px 20px;
            }
            .hero h1 {
                font-size: 3rem;
            }
            .features {
                padding: 60px 5%;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">TuneFlow</a>
        <nav>
            <a href="#">Home</a>
            <a href="#">Explore</a>
            <a href="#">Library</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Feel the Music</h1>
            <p>Listen to your favourite songs anytime and anywhere</p>
            <button class="cta-btn">Start Listening</button>
        </section>

        <section class="features">
            <h2>Popular Playlists</h2>
            <div class="cards-container">
                <!-- Card 1 -->
                <div class="card">
                    <div class="image-wrapper">
                        <!-- Single person dancing -->
                        <img src="https://images.unsplash.com/photo-1547153760-18fc86324498?w=800&q=80" alt="Night Vibes - Single person dancing">
                    </div>
                    <div class="card-content">
                        <h3>Night Vibes</h3>
                        <p>Top Pop Hits</p>
                    </div>
                </div>
                <!-- Card 2 -->
                <div class="card">
                    <div class="image-wrapper">
                        <!-- Microphone -->
                        <img src="https://images.unsplash.com/photo-1520523839897-bd0b52f945a0?w=800&q=80" alt="Chill Beats - Microphone">
                    </div>
                    <div class="card-content">
                        <h3>Chill Beats</h3>
                        <p>Relax and Steady</p>
                    </div>
                </div>
                <!-- Card 3 -->
                <div class="card">
                    <div class="image-wrapper">
                        <!-- Group of people dancing -->
                        <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=800&q=80" alt="EDM Mix - Group of people dancing">
                    </div>
                    <div class="card-content">
                        <h3>EDM Mix</h3>
                        <p>Festival Tracks</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 TuneFlow</p>
    </footer>

    <script>
        // Simple interactive JS
        document.addEventListener('DOMContentLoaded', () => {
            const ctaBtn = document.querySelector('.cta-btn');
            
            ctaBtn.addEventListener('click', () => {
                alert('Welcome to TuneFlow! Get ready to feel the music.');
            });

            // Smooth interaction for nav links
            const navLinks = document.querySelectorAll('nav a');
            navLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    console.log(`Navigated to ${e.target.textContent}`);
                });
            });
        });
    </script>
</body>
</html>
